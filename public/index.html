<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix - Watch TV Shows Online, Watch Movies Online</title>
  <link rel="icon" type="image/x-icon" href="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            netflixRed: '#E50914',
            netflixBlack: '#141414',
            netflixDark: '#181818',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-[#141414] text-white select-none">

  <!-- ================= NAVBAR ================= -->
  <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 md:px-12 py-3 bg-gradient-to-b from-black/80 to-transparent transition duration-500">
    <div class="flex items-center space-x-6 md:space-x-10">
      <a href="#" class="text-netflixRed text-2xl md:text-3xl font-extrabold tracking-tighter uppercase font-serif">
        NETFLIX
      </a>
      <ul class="hidden md:flex items-center space-x-5 text-sm text-gray-300 font-medium">
        <li><a href="#" class="text-white font-bold hover:text-white transition">Home</a></li>
        <li><a href="#" class="hover:text-gray-400 transition">TV Shows</a></li>
        <li><a href="#" class="hover:text-gray-400 transition">Movies</a></li>
        <li><a href="#" class="hover:text-gray-400 transition">New & Popular</a></li>
        <li><a href="#" class="hover:text-gray-400 transition">My List</a></li>
      </ul>
    </div>

    <div class="flex items-center space-x-4 md:space-x-6 text-gray-200">
            <!-- Refresh Trending Live Button -->
      <button id="refreshTrendingBtn" class="flex items-center space-x-1.5 bg-black/60 hover:bg-black/90 border border-red-500/40 hover:border-netflixRed text-xs px-3 py-1 rounded-full text-gray-200 hover:text-white transition shadow cursor-pointer group" title="Muat Ulang Trending Terkini">
        <span class="w-2 h-2 rounded-full bg-netflixRed animate-ping"></span>
        <span class="font-bold text-[11px] text-red-400 group-hover:text-white">LIVE TRENDING</span>
        <i data-lucide="refresh-cw" class="w-3 h-3 text-gray-400 group-hover:text-white group-hover:rotate-180 transition duration-500"></i>
      </button>

      <!-- Search Bar -->
      <div class="relative flex items-center">
        <div class="flex items-center bg-black/60 border border-gray-600 rounded-full px-3 py-1 focus-within:border-white transition">
          <i data-lucide="search" class="w-4 h-4 text-gray-400 mr-2"></i>
          <input id="searchInput" type="text" placeholder="Titles, people, genres" 
                 class="bg-transparent text-xs md:text-sm text-white focus:outline-none w-28 md:w-56 placeholder-gray-400" />
        </div>
      </div>

      <!-- Profile Avatar -->
      <div class="flex items-center space-x-2 cursor-pointer group">
        <div class="w-8 h-8 rounded bg-netflixRed flex items-center justify-center font-bold text-sm shadow">
          K
        </div>
        <i data-lucide="chevron-down" class="w-4 h-4 group-hover:rotate-180 transition duration-300"></i>
      </div>
    </div>
  </nav>

  <!-- ================= SEARCH RESULTS ================= -->
  <div id="searchResultsContainer" class="hidden min-h-screen"></div>

  <!-- ================= MAIN CONTENT ================= -->
  <main id="mainContent" class="relative">
    
    <!-- HERO BILLBOARD -->
    <div class="relative h-[70vh] md:h-[85vh] w-full overflow-hidden">
      <img id="heroBackdrop" src="" alt="Hero Backdrop" class="w-full h-full object-cover object-center" />
      <div class="absolute inset-0 hero-vignette flex flex-col justify-center px-4 md:px-12 pb-16">
        <div class="max-w-2xl">
          <div class="flex items-center space-x-2 mb-3">
            <span class="bg-netflixRed text-white text-[10px] md:text-xs font-bold px-2 py-0.5 rounded tracking-wider uppercase">Netflix Series</span>
            <span id="heroBadge" class="text-xs md:text-sm font-bold text-gray-200"></span>
          </div>

          <h1 id="heroTitle" class="text-3xl md:text-5xl lg:text-6xl font-extrabold mb-4 drop-shadow-lg tracking-tight">
            Loading...
          </h1>

          <p id="heroOverview" class="text-xs md:text-sm lg:text-base text-gray-200 mb-6 line-clamp-3 md:line-clamp-4 drop-shadow">
            Loading overview synopsis...
          </p>

          <div class="flex items-center space-x-3">
            <button id="heroPlayBtn" class="flex items-center space-x-2 bg-white hover:bg-gray-200 text-black px-5 md:px-8 py-2 md:py-2.5 rounded font-bold text-sm md:text-base transition duration-300 shadow">
              <i data-lucide="play" class="w-5 h-5 fill-current"></i>
              <span>Play</span>
            </button>
            <button id="heroInfoBtn" class="flex items-center space-x-2 bg-gray-500/60 hover:bg-gray-500/40 text-white px-5 md:px-7 py-2 md:py-2.5 rounded font-bold text-sm md:text-base transition duration-300 backdrop-blur-sm">
              <i data-lucide="info" class="w-5 h-5"></i>
              <span>More Info</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- CAROUSEL ROWS -->
    <div class="-mt-16 md:-mt-24 relative z-20 pb-20">
      
      <!-- TOP 10 ROW -->
      <div class="relative mb-8 group">
        <h2 class="text-lg md:text-xl lg:text-2xl font-bold mb-3 px-4 md:px-12 text-gray-100 flex items-center space-x-2">
          <span>Top 10 Movies Today in Indonesia</span>
        </h2>
        <div id="top10Row" class="flex items-center space-x-4 md:space-x-6 overflow-x-auto hide-scrollbar px-4 md:px-12 py-4"></div>
      </div>

      <!-- DYNAMIC ROWS -->
      <div id="rowsContainer"></div>
    </div>
  </main>

  <!-- ================= DETAIL MODAL ================= -->
  <div id="detailModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-2 md:p-6 overflow-y-auto">
    <div class="relative w-full max-w-4xl bg-[#181818] rounded-lg overflow-hidden shadow-2xl my-auto text-white">
      
      <!-- Modal Header Backdrop -->
      <div class="relative h-64 md:h-96 w-full">
        <img id="modalBackdrop" src="" class="w-full h-full object-cover" />
        <div class="absolute inset-0 modal-backdrop-gradient flex flex-col justify-end p-6 md:p-10">
          <h2 id="modalTitle" class="text-2xl md:text-4xl font-extrabold mb-4 drop-shadow"></h2>
          <div class="flex items-center space-x-3">
            <button id="modalPlayBtn" class="flex items-center space-x-2 bg-white hover:bg-gray-200 text-black px-6 py-2 rounded font-bold text-sm transition">
              <i data-lucide="play" class="w-4 h-4 fill-current"></i>
              <span>Play</span>
            </button>
          </div>
        </div>

        <button id="closeModalBtn" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-black/70 hover:bg-black text-white flex items-center justify-center transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 md:p-10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
          <div class="md:col-span-2 space-y-3">
            <div class="flex items-center space-x-3 text-sm">
              <span id="modalMatch" class="text-green-400 font-bold"></span>
              <span id="modalYear" class="text-gray-300"></span>
              <span id="modalRating" class="border border-gray-500 px-1 text-xs rounded text-gray-300"></span>
              <span id="modalDuration" class="text-gray-300"></span>
              <span id="modalQuality" class="border border-gray-500 px-1 text-[10px] rounded text-gray-400 font-semibold"></span>
            </div>
            <p id="modalOverview" class="text-sm md:text-base text-gray-300 leading-relaxed"></p>
          </div>

          <div class="text-xs space-y-2 text-gray-400">
            <div><span class="text-gray-500">Cast:</span> <span id="modalCast" class="text-gray-200"></span></div>
            <div><span class="text-gray-500">Genres:</span> <span id="modalGenres" class="text-gray-200"></span></div>
          </div>
        </div>

        <!-- Episodes Section with Season Selector -->
        <div id="modalEpisodesSection" class="hidden mb-8">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-xl font-bold text-white flex items-center space-x-2">
              <i data-lucide="tv" class="w-5 h-5 text-netflixRed"></i>
              <span>Episodes</span>
            </h3>
            <div class="flex items-center space-x-2">
              <label for="modalSeasonSelect" class="text-xs text-gray-400">Pilih Musim:</label>
              <select id="modalSeasonSelect" class="bg-[#242424] border border-gray-600 text-xs font-semibold px-3 py-1.5 rounded text-white focus:outline-none focus:border-netflixRed cursor-pointer shadow">
              </select>
            </div>
          </div>
          <div id="modalEpisodesList" class="space-y-3 max-h-96 overflow-y-auto pr-1"></div>
        </div>

        <!-- Similar Recommendations -->
        <div>
          <h3 class="text-xl font-bold mb-4">More Like This</h3>
          <div id="modalSimilarGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= NETFLIX VIDEO PLAYER OVERLAY ================= -->
  <div id="videoPlayerOverlay" class="fixed inset-0 z-50 bg-black hidden flex flex-col justify-between">
    
    <!-- Top Bar (Back button + Title + Server Switcher) -->
    <div class="p-3 md:p-5 flex items-center justify-between bg-gradient-to-b from-black/95 to-transparent z-50">
      <div class="flex items-center space-x-4">
        <button id="playerBackBtn" class="p-2 rounded-full hover:bg-white/20 transition cursor-pointer">
          <i data-lucide="arrow-left" class="w-6 h-6 text-white"></i>
        </button>
        <div>
          <h3 id="playerTitle" class="text-base md:text-lg font-bold tracking-wide"></h3>
          <span id="currentServerLabel" class="text-xs text-green-400 font-medium">Server HD 1 (Film Asli)</span>
        </div>
      </div>

      <!-- Server Switcher Dropdown -->
      <div class="flex items-center space-x-2">
        <span class="text-xs text-gray-400 hidden sm:inline">Pilih Sumber:</span>
        <select id="serverSelect" class="bg-[#181818] border border-gray-600 text-xs px-3 py-1.5 rounded text-white focus:outline-none focus:border-netflixRed cursor-pointer shadow">
          <!-- Dynamic servers populated here -->
        </select>
      </div>
    </div>

    <!-- Video Element / Embed Container -->
    <div class="relative flex-1 flex items-center justify-center overflow-hidden w-full h-full bg-black">
      <iframe id="embedPlayer" class="w-full h-full border-0 hidden" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
      <video id="videoElement" class="w-full h-full object-contain cursor-pointer hidden" playsinline></video>
      <div id="playerLoader" class="absolute inset-0 flex items-center justify-center bg-black/40">
        <div class="w-12 h-12 border-4 border-netflixRed border-t-transparent rounded-full animate-spin"></div>
      </div>
    </div>

    <!-- Bottom Controls Overlay (Active when HLS video is used) -->
    <div id="playerControls" class="p-4 md:p-6 bg-gradient-to-t from-black/95 via-black/70 to-transparent z-50 transition duration-300 hidden">
      <!-- Progress Bar -->
      <div class="flex items-center space-x-3 mb-3">
        <span id="timeProgress" class="text-xs text-gray-300 w-12 text-right font-mono">00:00</span>
        <input id="progressBar" type="range" min="0" max="100" value="0" step="0.1" class="w-full netflix-slider" />
        <span id="timeDuration" class="text-xs text-gray-300 w-12 font-mono">00:00</span>
      </div>

      <!-- Control Buttons -->
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4 md:space-x-6">
          <button id="playPauseBtn" class="hover:text-netflixRed transition">
            <i id="playPauseIcon" data-lucide="play" class="w-6 h-6 fill-current"></i>
          </button>
          <button id="rewindBtn" class="hover:text-netflixRed transition" title="10s Backward">
            <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
          </button>
          <button id="forwardBtn" class="hover:text-netflixRed transition" title="10s Forward">
            <i data-lucide="rotate-cw" class="w-5 h-5"></i>
          </button>
          <div class="flex items-center space-x-2 group">
            <button id="volumeBtn" class="hover:text-netflixRed transition">
              <i data-lucide="volume-2" class="w-5 h-5"></i>
            </button>
            <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="1" class="w-16 md:w-24 netflix-slider" />
          </div>
        </div>

        <div class="flex items-center space-x-4 md:space-x-6 text-sm">
          <div class="flex items-center space-x-1 bg-black/60 border border-gray-700 px-2 py-1 rounded">
            <i data-lucide="message-square" class="w-4 h-4 text-gray-400"></i>
            <select id="subtitlesSelect" class="bg-transparent text-xs text-white focus:outline-none cursor-pointer">
              <option value="id" class="bg-[#181818]" selected>Bahasa Indonesia</option>
              <option value="en" class="bg-[#181818]">English</option>
              <option value="off" class="bg-[#181818]">Subtitles Off</option>
            </select>
          </div>

          <button id="fullscreenBtn" class="hover:text-netflixRed transition" title="Fullscreen (F)">
            <i data-lucide="maximize" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
